# Configuració de sensibilitat del ratolí (Càmera)
camera:
  sensitivity_x: 0.8       # Velocitat horitzontal (0.1 a 2.0)
  sensitivity_y: 0.8       # Velocitat vertical
  invert_y: false          # Posar 'true' per invertir l'eix Y (estil avió)
  deadzone: 0.15           # Zona morta (0.0 a 0.3) per evitar drift
  max_speed: 1.0           # Límit màxim de sortida analògica

# Mapeig de Tecles (Teclat -> Botons Switch/Xbox)
# Utilitza les claus de pynput (ex: Key.space, 'a', 'Key.shift')
buttons:
  A: 'k'                   # Botó A (Salta/Confirma)
  B: 'j'                   # Botó B (Corre/Cancel·la)
  X: 'i'                   # Botó X (Acció/Arma)
  Y: 'l'                   # Botó Y (Canvi arma)
  L: 'q'                   # Gall esquerre
  R: 'e'                   # Gall dret
  ZL: 'Left Shift'         # Apuntar/Escut (Trigger analògic)
  ZR: 'Right Shift'        # Disparar/Atac fort (Trigger analògic)
  MINUS: 'BackSpace'       # Menú inventari
  PLUS: 'Enter'            # Pausa
  HOME: 'Home'             # Home (no sempre funcional a emuladors)
  CAPTURE: 'End'           # Captura (Screenshot)
  
  # Stick Esquerre (Moviment Personatge) - Assigna tecles WASD
  stick_left_up: 'w'
  stick_left_down: 's'
  stick_left_left: 'a'
  stick_left_right: 'd'

  # D-Pad (Fletxes)
  dpad_up: 'Up'
  dpad_down: 'Down'
  dpad_left: 'Left'
  dpad_right: 'Right'

# Control de la càmera amb ratolí
mouse_control:
  enabled: true
  always_active: true      # Si false, necessites una tecla per bloquejar el cursor